<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My network map</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090a">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one topology canvas with four network zones, a detail panel beside it (below on phones), device index underneath. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --zone:#eef1f5; --line:#e4e8ee; --fg:#191d24; --muted:#6b7684;
  --lan:#0c8f86; --ai:#c2487f; --direct:#b9770a; --ts:#6a55d6; --zte:#4a8527; --wan:#52708f; --warn:#b9770a;
  --node:#ffffff; --node-stroke:#aab4c2; --ok:#2a8a55; --bad:#c23b3b;
  --s-bg1:#e6e9ee; --s-bg2:#f8f9fb;
  --f-display:"Space Grotesk","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08090a; --surface:#101114; --zone:#121317; --line:rgba(255,255,255,.09); --fg:#f7f8f8; --muted:#8a8f98;
  --lan:#35c9bd; --ai:#f07fb0; --direct:#f0b545; --ts:#8b7dff; --zte:#9bd46a; --wan:#8fb0d1; --warn:#f0b545;
  --node:#1a1c20; --node-stroke:#34383f; --ok:#3fbf7f; --bad:#ff7b7b; --s-bg1:#0e0f12; --s-bg2:#17181c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08090a; --surface:#101114; --zone:#121317; --line:rgba(255,255,255,.09); --fg:#f7f8f8; --muted:#8a8f98;
  --lan:#35c9bd; --ai:#f07fb0; --direct:#f0b545; --ts:#8b7dff; --zte:#9bd46a; --wan:#8fb0d1; --warn:#f0b545;
  --node:#1a1c20; --node-stroke:#34383f; --ok:#3fbf7f; --bad:#ff7b7b; --s-bg1:#0e0f12; --s-bg2:#17181c; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.7rem;margin:0;letter-spacing:-.01em}
.stamp{color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
button.chip{font:500 .85rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
button.chip:hover{border-color:var(--muted)}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.chip:focus-visible,.node:focus-visible,.idx button:focus-visible{outline:2px solid var(--ts);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;min-width:0}
svg#map{display:block;width:100%;min-width:820px;height:auto;font-family:var(--f-body)}
.zone{fill:var(--zone);stroke:var(--line)}
.zlabel{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;fill:var(--muted)}
.zsub{font:400 10.5px var(--f-mono);fill:var(--muted)}
.link{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.55;transition:opacity .2s,stroke-width .2s}
.t-lan{stroke:var(--lan)} .t-roce{stroke:var(--ai);stroke-width:3} .t-direct{stroke:var(--direct);stroke-width:2.4}
.t-ts{stroke:var(--ts);stroke-dasharray:5 5} .t-zte{stroke:var(--zte)} .t-wan{stroke:var(--wan);stroke-width:2}
.pk{transition:opacity .2s} .pk.t-lan{fill:var(--lan)} .pk.t-roce{fill:var(--ai)} .pk.t-direct{fill:var(--direct)} .pk.t-ts{fill:var(--ts)} .pk.t-zte{fill:var(--zte)} .pk.t-wan{fill:var(--wan)}
.llabel{font:500 10px var(--f-mono);fill:var(--muted);paint-order:stroke;stroke:var(--zone);stroke-width:4px}
.node{cursor:pointer;transition:opacity .2s}
.node rect{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.4;transition:stroke .15s,stroke-width .15s}
.node path{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node .nm{font:600 10.5px var(--f-body);fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--zone);stroke-width:4px}
.node .ip{font:400 10px var(--f-mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--zone);stroke-width:4px}
.node:hover rect,.node.sel rect{stroke:var(--fg);stroke-width:2.2}
.node.guess rect{stroke-dasharray:4 3}
.node.hub rect{stroke:var(--fg);stroke-width:2}
svg.dim .link:not(.hot),svg.dim .pk:not(.hot){opacity:.08}
svg.dim .node:not(.hot){opacity:.28}
svg .link.hot{opacity:1}
#runner{fill:var(--fg);stroke:var(--surface);stroke-width:2}
aside{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0;text-wrap:balance}
aside .mono,.mono{font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere}
aside p{margin:0;font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;font-weight:600;border-radius:6px;padding:2px 7px;border:1px solid currentColor}
.note{font-size:.8rem;color:var(--warn)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:.84rem}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nb{display:flex;flex-wrap:wrap;gap:6px}
.steps{margin:0;padding-left:1.2em;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.idx section{display:flex;flex-direction:column;gap:6px;min-width:0}
.idx h3{font:600 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;margin:0;display:flex;gap:8px;align-items:center}
.idx button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px;font-size:.87rem}
.idx button:hover{background:var(--surface)}
.idx button span:last-child{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fold>summary{cursor:pointer;list-style:none;padding:9px 14px;font:600 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';font-size:.85rem;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--fg)}
.foldin{padding:0 14px 12px}
.foldin.bars{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-top:2px}
.foldin.bars .bar{display:contents}

.stagecol{min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.stagecol:fullscreen{background:var(--bg);padding:10px}
.stagecol:fullscreen #stage3d{flex:1 1 auto;aspect-ratio:auto;min-height:0;max-width:none}
.stagecol:fullscreen #stage2d{flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stagecol:fullscreen svg#map{min-width:0;width:100%;height:100%}
#fsx{position:absolute;top:12px;right:12px;z-index:6;display:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.stagecol:fullscreen #fsx{display:inline-flex}
#fsTip{position:absolute;display:block;z-index:7;max-width:320px;padding:14px 16px 12px;background:color-mix(in srgb,var(--surface) 62%,transparent);border:1px solid color-mix(in srgb,var(--fg) 12%,transparent);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);font-size:.85rem;line-height:1.5;opacity:0;visibility:hidden;transform:translateY(10px) scale(.95);transform-origin:0 100%;transition:opacity .16s ease,transform .24s cubic-bezier(.32,1.35,.5,1),visibility .16s}
#fsTip.on{opacity:1;visibility:visible;transform:none}
#fsTip .fsT-name{font:600 1.05rem var(--f-display);letter-spacing:-.01em;margin:0 0 2px}
#fsTip .fsT-rows{display:grid;gap:2px;margin:6px 0 2px}
#fsTip .fsT-row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
#fsTip .fsT-k{color:var(--muted);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
#fsTip .fsT-v{text-align:right;overflow-wrap:anywhere}
#fsTip .fsT-close{position:absolute;top:8px;right:8px;padding:2px 8px;font-size:.8rem}
#fsTip .strip{height:12px;margin:8px 0 2px}
#fsTip .strip-lbl{font-size:.68rem;color:var(--muted)}
@media (max-width:720px){
  #fsTip{left:10px!important;right:10px;top:auto!important;bottom:12px;max-width:none;transform:translateY(14px);border-radius:20px 20px 16px 16px}
  #fsTip.on{transform:none}
}
.node.past{opacity:.22}
.node.past text{opacity:.5}
#stage3d{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(var(--s-bg2),var(--s-bg1))}
#stage3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage3d canvas.pt{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font:500 11px var(--f-body);color:var(--fg);transition:opacity .2s;will-change:transform}
.l3 small{display:none;font:400 9.5px var(--f-mono);color:var(--muted)}
.l3.on small{display:block}
.l3.on{font-weight:600}
.l3.dim{opacity:.25}
.l3.z{font:600 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.hint3d{position:absolute;left:12px;bottom:10px;font-size:.72rem;color:var(--muted);pointer-events:none}
.stamp .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.stamp.stale .live{background:var(--warn)}
#q{font:400 .85rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;width:230px;max-width:100%;min-width:0}
#q:focus-visible,.edit input:focus-visible,.edit select:focus-visible,a.open:focus-visible,.cams button:focus-visible,.card button:focus-visible{outline:2px solid var(--ts);outline-offset:2px}
.none{font-size:.85rem;color:var(--muted)}
.node.off{opacity:.45} .node.off rect{stroke-dasharray:2 3}
.node.down rect{stroke:var(--bad);stroke-width:2.4} .node.down path{stroke:var(--bad)}
.link.wifi{stroke-dasharray:1.5 5}
.status{font-size:.84rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.unk{background:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
a.open{font:500 .85rem var(--f-body);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none}
a.open:hover{border-color:var(--muted)}
.edit{display:flex;flex-direction:column;gap:8px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:.76rem;color:var(--muted)}
.edit input,.edit select{font:400 .88rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
ul.fx{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.cams{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px}
.cams button{font:500 .74rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.cams button:hover{border-color:var(--muted)}
.l3.s{display:none} .l3.s.on{display:block}
.l3.off{color:var(--muted);text-decoration:line-through}
.sect{font:600 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .ctop{display:flex;align-items:center;gap:8px}
.card button{all:unset;cursor:pointer;font-weight:600;font-size:.9rem}
.card button:hover{text-decoration:underline}
.card .meta{font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.card a{color:var(--fg);font-size:.8rem}
.newrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;padding:6px 0;border-top:1px solid var(--line)}
.rtt{font:500 9.5px var(--f-mono);fill:var(--fg);paint-order:stroke;stroke:var(--zone);stroke-width:4px}
.rtt.warn{fill:var(--warn)} .rtt.bad{fill:var(--bad)}
.l3.rl{font:500 9.5px var(--f-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 6px;text-shadow:none}
.l3.rl.warn{color:var(--warn)} .l3.rl.bad{color:var(--bad)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prn,.hist{display:flex;flex-direction:column;gap:6px}
.strip{display:flex;gap:1px;height:16px}
.strip i{flex:1;border-radius:2px;background:var(--line)}
.strip i.u{background:var(--ok)} .strip i.p{background:var(--warn)} .strip i.d{background:var(--bad)} .strip i.n{opacity:.35}
.strip-lbl{font-size:.7rem;color:var(--muted)}
.newrow select{font:400 .82rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%;min-width:0}
@media (max-width:900px){ .main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ #stage3d{aspect-ratio:4/5} .l3{font-size:10px} }
@media (prefers-reduced-motion: reduce){ .link,.node,.pk{transition:none} }
/* --- premium pass (Linear-style) --- */
body{font-feature-settings:"cv01","ss03";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:radial-gradient(1100px 420px at 50% -120px,color-mix(in srgb,var(--ts) 7%,transparent),transparent 70%),var(--bg)}
h1{letter-spacing:-.03em}
button.chip{border-radius:8px;font-weight:500;transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;
  background:color-mix(in srgb,var(--fg) 3%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.05)}
button.chip:hover{border-color:color-mix(in srgb,var(--fg) 28%,transparent);background:color-mix(in srgb,var(--fg) 6%,transparent)}
button.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--ts) 16%,transparent);border-color:color-mix(in srgb,var(--ts) 55%,transparent);color:var(--fg);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--ts) 40%,transparent)}
button.chip[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--ts) 22%,transparent)}
.stage,#stage3d,aside,.fold{box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px -8px rgba(0,0,0,.08)}
aside{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px)}
aside h2{letter-spacing:-.015em}
dt{font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
dd{color:color-mix(in srgb,var(--fg) 86%,transparent)}
.fold>summary{transition:color .15s ease,background .15s ease;border-radius:12px}
.fold>summary:hover{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.fold[open]>summary{color:var(--fg)}
::selection{background:color-mix(in srgb,var(--ts) 30%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 22%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
input#q{background:color-mix(in srgb,var(--fg) 3%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:500 .85rem var(--f-body);color:var(--fg);transition:border-color .15s ease,box-shadow .15s ease}
input#q:focus{outline:none;border-color:color-mix(in srgb,var(--ts) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ts) 18%,transparent)}
</style>

<body>
<div class="wrap">
  <header>
    <h1>My network map</h1>
    <span class="stamp" id="stamp">Snapshot of 15 Nov 2026 · this copy does not auto-refresh</span>
  </header>

  <div class="bar" id="views"><span class="lbl">View</span></div>
  <div class="bar" id="qres" hidden></div>

  <details class="fold" id="morefold">
    <summary>Filters, flows, exposure, drills</summary>
    <div class="foldin bars">
      <div class="bar" id="filters"><span class="lbl">Network</span></div>
      <div class="bar" id="flows"><span class="lbl">Flow</span></div>
      <div class="bar" id="expos"><span class="lbl">Access</span></div>
    </div>
  </details>

  <div class="main">
    <div class="stagecol"><div id="stage3d" hidden><div id="labels"></div><div class="cams" id="cams"></div><div class="hint3d">Drag to orbit · scroll or pinch to zoom · click a device</div></div><div class="stage" id="stage2d"><svg id="map" viewBox="0 0 1000 770" role="group" aria-label="Schemat sieci"></svg></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </div>

  <details class="fold"><summary>Services on the server</summary><div class="foldin"><div class="svc" id="svc"></div></div></details>
  <details class="fold" id="outsec" hidden><summary>Recent outages (7 days)</summary><div class="foldin"><div id="outlist"></div></div></details>
  <details class="fold" id="newsec" hidden><summary>Unknown devices on the LAN</summary><div class="foldin"><div id="newdev"></div></div></details>
  <details class="fold"><summary>Device index</summary><div class="foldin"><div class="idx" id="idx"></div></div></details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const NETS={
  net:{name:'Internet & cloud',col:'var(--wan)',sub:'services away from home'},
  lan:{name:'Home LAN',col:'var(--lan)',sub:'192.168.30.0/22 · brama 192.168.30.1'},

  ts:{name:'Tailscale',col:'var(--ts)',sub:'tail84733f.ts.net · 100.x'},
  zte:{name:'Second LAN (ZTE)',col:'var(--zte)',sub:'192.168.8.0/24 · reachable via Tailscale'}
};
const ICON={
  router:'M4 14h16v5H4z M8 14V9 M16 14V9 M7.5 16.5h.01',
  computer:'M4 5h16v10H4z M9 19h6 M12 15v4',
  server:'M5 4h14v6H5z M5 14h14v6H5z M8 7h.01 M8 17h.01',
  phone:'M8 3h8v18H8z M11 18h2',
  tv:'M3 5h18v11H3z M8 20h8',
  printer:'M7 9V4h10v5 M5 9h14v8H5z M8 14h8v6H8z',
  bulb:'M9 18h6 M10 21h4 M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z',
  appliance:'M5 3h14v18H5z M5 8h14 M9 14.5a3 3 0 1 0 6 0a3 3 0 1 0-6 0',

const vb=document.getElementById('views'), s3=document.getElementById('stage3d'), s2=document.getElementById('stage2d');
function ensure3d(){
  if(V3||v3Tried)return V3;
  v3Tried=true;
  try{V3=init3d()}catch(e){V3=null}
  if(V3){
    const cb=document.getElementById('cams');
    if(cb&&!cb.childElementCount)[['all','Overview'],['top','Top down'],['mac','Home server'],['ai','AI cluster'],['zte','ZTE network'],['net','Internet']].forEach(([k,n])=>{const b=h('button',{type:'button',id:'cam-'+k},n);b.onclick=()=>V3.view(k);cb.append(b)});
    applyNotes();applyStates();paint();if(showRtt){V3.rtt(true);applyLinks()}
  }else{
    vb.querySelectorAll('button[data-v]').forEach(b=>{b.hidden=true});
  }
  return V3;
}
function setView(v){
  if(v==='3d'&&!ensure3d())v='2d'; view=v; s3.hidden=v!=='3d'; s2.hidden=v!=='2d';
  vb.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  if(v==='2d'){place();if(flow)placeRunner(Math.min(flowT,flow.total))} else V3.resize();
  const pb2=document.getElementById('png');if(pb2)pb2.hidden=v!=='3d';
}
[['3d','3D'],['2d','2D schematic']].forEach(([k,n])=>{const b=h('button',{class:'chip',type:'button','aria-pressed':'false',id:'view-'+k},n);b.dataset.v=k;b.onclick=()=>{location.hash=k;setView(k)};vb.append(b)});
vb.append(q);
const refBtn=h('button',{class:'chip',type:'button',id:'refbtn',hidden:true,title:'Trigger an immediate network scan'},'Refresh');
refBtn.onclick=async()=>{refBtn.disabled=true;refBtn.textContent='Refreshing…';refTs=(LIVE&&LIVE.ts)||0;
  try{await fetch('refresh',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'netglass'},body:'{}'})}catch(e){}
  setTimeout(()=>{if(refBtn.disabled){refBtn.disabled=false;refBtn.textContent='Refresh';loadLive()}},16000)};
vb.append(refBtn);
const fsTarget=document.querySelector('.stagecol');
const fsBtn=h('button',{class:'chip',type:'button',id:'fs','aria-pressed':'false'},'Fullscreen map');
const pngBtn=h('button',{class:'chip',type:'button',id:'png',title:'Save widok 3D mapy jako obraz PNG'},'PNG snapshot');
pngBtn.onclick=()=>{if(view!=='3d'||!V3)return;const a=document.createElement('a');a.download='netglass.png';a.href=V3.snapshot();document.body.append(a);a.click();a.remove()};
fsBtn.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else fsTarget.requestFullscreen().catch(()=>{})};
addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.target===document.body){e.preventDefault();fsBtn.click()}});
const fsx=h('button',{class:'chip',type:'button',id:'fsx'},'✕ Zamknij');
fsx.onclick=()=>document.exitFullscreen();
fsTarget.append(fsx);
const thBtn=h('button',{class:'chip',type:'button',id:'theme','aria-pressed':'false'});
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':sysDark()};
function syncTheme(){thBtn.textContent=isDark()?'☀ Light':'☾ Dark';thBtn.setAttribute('aria-pressed',String(isDark()))}
thBtn.onclick=()=>{const nd=isDark()?'light':'dark';document.documentElement.dataset.theme=nd;try{localStorage.setItem('mapa-theme',nd)}catch(e){};syncTheme()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);syncTheme();
vb.append(thBtn);
// chmurka of details urządzenia w trybie pełnoekranowym
const fsTip=h('div',{id:'fsTip','aria-live':'polite'});
fsTarget.append(fsTip);
const fsTipX=h('button',{class:'chip fsT-close',type:'button','aria-label':'Close bubble'},'✕');
fsTipX.onclick=()=>{if(sel)select(null);else updateFsTip()};
function fsTipAt(x,y,ax){
  fsTip.classList.add('on');
  fsTip.style.left='0px';fsTip.style.top='0px';
  const r=fsTip.getBoundingClientRect(),host=fsTarget.getBoundingClientRect();
  if(ax!=null&&x+r.width>host.width-10&&ax-r.width-18>10)x=ax-r.width-18; // przy prawej krawędzi: po drugiej stronie punktu
  x=Math.max(10,Math.min(x,host.width-r.width-10));y=Math.max(10,Math.min(y,host.height-r.height-10));
  fsTip.style.left=x+'px';fsTip.style.top=y+'px';
}
function fsTipAnchor(){if(view!=='3d'||!V3||!sel)return null;return V3.screenPos(sel)}
function fsTipPos(){const a=fsTipAnchor();if(!a||!fsTip.classList.contains('on'))return;fsTipAt(a.x+18,a.y-14,a.x)}
function fsTipRow(k,v,mono){const r=h('div',{class:'fsT-row'});r.append(h('span',{class:'fsT-k'},k));if(v instanceof Node)r.append(v);else r.append(h('span',{class:'fsT-v'+(mono?' mono':'')},String(v)));return r}
function relSeen(ts){const now=LIVE?LIVE.ts:Date.now()/1e3,s=now-ts;if(s<90)return'just now';if(s<3600)return Math.max(1,Math.round(s/60))+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(ts*1e3).toLocaleString('pl-PL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function updateFsTip(){
  const active=document.fullscreenElement===fsTarget&&sel&&!sim.on&&!replay.on&&byId[sel];
  if(!active){fsTip.classList.remove('on');return}
  const n=byId[sel],note=NOTES[n.id]||{};
  const d=LIVE&&!sim.on?(n.svc?LIVE.services[n.id]:LIVE.devices[n.id]):null;
  fsTip.replaceChildren(h('p',{class:'fsT-name'},n.name));
  const rows=h('div',{class:'fsT-rows'});
  if(d&&d.up!==undefined){const st=h('span',{class:'fsT-v'},d.up?'OK':'Nie respond');st.style.color=d.up?'var(--ok)':'var(--bad)';st.style.fontWeight='600';rows.append(fsTipRow('Status',st))}
  if(d&&d.ips&&d.ips.length)rows.append(fsTipRow('IP',d.ips.join(', '),1));
  else if(n.ip)rows.append(fsTipRow('IP',n.ip,1));
  if(d&&d.mac)rows.append(fsTipRow('MAC',d.mac,1));
  if(d&&d.vendor)rows.append(fsTipRow('Vendor',d.vendor));
  if(d&&d.name)rows.append(fsTipRow('mDNS name',d.name));
  const conn=CONN_TXT[n.conn]||CONN_TXT[CONN0[n.id]];if(conn&&!n.svc)rows.append(fsTipRow('Link',conn));
  if(d&&d.rtt!=null)rows.append(fsTipRow('Latency',fmtMs(d.rtt)+' from the server'));
  if(d&&d.last_seen){const rel=relSeen(d.last_seen);if(rel)rows.append(fsTipRow('Last seen',rel))}
  if(n.guess)rows.append(fsTipRow('Matched','by MAC only'));
  if(note.note)rows.append(fsTipRow('Notatka',note.note));
  if(rows.children.length)fsTip.append(rows);
  const it=HIST&&HIST.items[n.id]; // dostępność 24 h + ostatnia przerwa
  if(it&&it.bars){
    const strip=h('div',{class:'strip',role:'img','aria-label':'Availability w ostatnich 24 godzinach'});
    it.bars.forEach((v,k)=>{const c=v==null?'n':v>=.99?'u':v>0?'p':'d',i=h('i',{class:c});i.title=fmtT(HIST.ts-86400+k*1800)+(v==null?' no data':' · '+Math.round(v*100)+'%');strip.append(i)});
    fsTip.append(strip,h('div',{class:'strip-lbl'},'24 h uptime: '+(it.u24==null?'no data':it.u24+'%')));
    const o=it.out.slice(-1)[0];
    if(o)fsTip.append(h('div',{class:'none'},'Last outage: '+(o[1]?fmtD(o[0])+' – '+fmtT(o[1])+' ('+fmtDur(o[1]-o[0])+')':'since '+fmtD(o[0])+', ongoing')));
  }
  if(d&&d.mac&&!d.up&&!d.never){ // WoL prosto of chmurki
    const wb=h('button',{class:'chip',type:'button',id:'fs-wol'},'Wake (WoL)');
    wb.onclick=async()=>{wb.disabled=true;wb.textContent='Sending magic…';
      try{const r=await fetch('wol',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'netglass'},body:JSON.stringify({id:n.id})});wb.textContent=r.ok?'Sent ✓':'Error'}catch(e){wb.textContent='Error'}};
    fsTip.append(wb);
  }
  fsTip.append(fsTipX);
  const a=fsTipAnchor();
  if(a){fsTipAt(a.x+18,a.y-14,a.x);return}
  let x=70,y=64; // domyślnie psince przyciskiem zamknięcia (widok 3D bez rzutu)
  if(view==='2d'&&!s2.hidden){
    try{const pt=svg.createSVGPoint();pt.x=n.x;pt.y=n.y;const m=svg.getScreenCTM();
      if(m){const q=pt.matrixTransform(m);const host=fsTarget.getBoundingClientRect();x=q.x-host.left+16;y=q.y-host.top+16}}catch(e){}
  }
  fsTipAt(x,y);
}
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;fsBtn.textContent=on?'Exit fullscreen':'Fullscreen map';fsBtn.setAttribute('aria-pressed',on);updateFsTip()});
vb.append(fsBtn,pngBtn);
try{NOTES=JSON.parse(localStorage.getItem('mapa-notatki')||'{}')||{}}catch(e){NOTES={}}
applyNotes(); applyStates(); loadLive();
const fromHash=()=>setView(location.hash==='#2d'?'2d':'3d');
addEventListener('hashchange',fromHash); fromHash();
if(reduced){playing=false;pb.textContent='Resume motion';pb.setAttribute('aria-pressed','true')}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
startTick();
</script>
</body>
